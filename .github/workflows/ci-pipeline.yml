name: '[CI/CD] CI Pipeline'
on: # Test pull requests and any push to main.
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - id: bun-install
        name: Clean install
        run: bun install --frozen-lockfile
      - id: markdownlint
        name: Install mardownlint
        run: bun add --global markdownlint-cli
      - name: Linters
        run: |
          bun run lint
          markdownlint *.md **/*.md --ignore node_modules
      - name: Tests
        # Run tests if linter fails
        if: always() && steps.bun-install.outcome == 'success'
        run: bun run test-ci

  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@hlhc"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - id: package-meta
        name: Validate tag matches package version
        run: |
          VERSION=$(bun -e 'import { readFileSync } from "node:fs"; const p = JSON.parse(readFileSync("package.json", "utf8")); console.log(p.version);')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
      - name: Build
        run: bun run build
      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build binaries
        run: |
          mkdir -p dist/binaries
          bun build ./bin/index.ts --compile --target=bun-linux-x64 --outfile dist/binaries/readme-generator-linux-x64
          bun build ./bin/index.ts --compile --target=bun-linux-arm64 --outfile dist/binaries/readme-generator-linux-arm64
          bun build ./bin/index.ts --compile --target=bun-darwin-x64 --outfile dist/binaries/readme-generator-darwin-x64
          bun build ./bin/index.ts --compile --target=bun-darwin-arm64 --outfile dist/binaries/readme-generator-darwin-arm64
          bun build ./bin/index.ts --compile --target=bun-windows-x64 --outfile dist/binaries/readme-generator-windows-x64.exe
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: true
          files: dist/binaries/*
          body: |
            ## Release ${{ github.ref_name }}

            ### Install from GitHub Packages

            ```bash
            npm config set @hlhc:registry https://npm.pkg.github.com
            npm install @hlhc/readme-generator-for-helm@${{ steps.package-meta.outputs.version }}
            ```

            ### CLI usage

            ```bash
            npm_config_registry=https://npm.pkg.github.com npx @hlhc/readme-generator-for-helm --help
            ```

            ### Standalone binaries

            Download the appropriate binary for your platform from the assets below:

            | Platform | Architecture | Binary |
            |:---------|:-------------|:-------|
            | Linux | x64 | `readme-generator-linux-x64` |
            | Linux | arm64 | `readme-generator-linux-arm64` |
            | macOS | x64 | `readme-generator-darwin-x64` |
            | macOS | arm64 | `readme-generator-darwin-arm64` |
            | Windows | x64 | `readme-generator-windows-x64.exe` |
