name: '[CI/CD] CI Pipeline'
on: # Test pull requests and any push to main.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - id: bun-install
        name: Clean install
        run: bun install --frozen-lockfile
      - id: markdownlint
        name: Install mardownlint
        run: bun add --global markdownlint-cli
      - name: Linters
        run: |
          bun run lint
          markdownlint *.md **/*.md
      - name: Tests
        # Run tests if linter fails
        if: always() && steps.bun-install.outcome == 'success'
        run: bun run test-ci

  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Configure GitHub Packages auth
        run: |
          SCOPE=$(bun -e 'import { readFileSync } from "node:fs"; const p = JSON.parse(readFileSync("package.json", "utf8")); console.log(p.name.split("/")[0]);')
          echo "${SCOPE}:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish package
        run: bun publish --registry https://npm.pkg.github.com
